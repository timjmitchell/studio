# Scenarios: an intent (who listens, on what, hearing what) plus Tim's PREFERRED realization.
# Possible realizations are derived from the inventory; only preferred ones are recorded here.
# Model: docs/studio/model.md §2 (intent vs realization), §4.7 (monitor mix).
# default = true: part of the studio's default setup. A snapshot that differs is drift from the default.

[[scenario]]
id = "desk-headphones"
intent = "Tracking or mixing at the desk on headphones"
listener = "tim"
transducer = "mdr-7506:plug"
mix = "main mix"
realization = [
  "UA cue 1 (Twin X 'HP'): MIX lit → carries the main mix",
  "logic-pro:main-out → apollo-twin-x:virtual-1/2",
]
default = true   # part of the studio default monitoring setup (Tim, 2026-10-11)
status = "live"   # matches the UA engine 2026-10-11

[[scenario]]
id = "wedge-vocal-ideas"
intent = "Rehearsing, or singing vocal ideas to a floor wedge"
listener = "tim"
transducer = "turbosound-wedge:in"
mix = "monitor mix (own blend, mono)"
realization = [
  "UA CUE 3: own cue mix, MONO lit (one speaker)",
  "Cue Mirror to: Line 3-4 → apollo-x8:line-out-3",
]
default = true   # part of the studio default monitoring setup (Tim, 2026-10-11)
status = "tested"   # 🧪 2026-10-11: set by Tim in Console ~23:15, read back from the engine, signal heard at
                    # the wedge. Not yet saved to a Console session. (22:05 snapshot had no mirror.)
# CUE 3 blend at 22:05: A1 Mic Dyn −18.2 dB, B1 PdlBrd −41.6 dB.

[[scenario]]
id = "in-ears"
intent = "Recording or rehearsing on in-ears"
listener = "tim"
transducer = "psm300-pack:rf"
mix = "monitor mix (stereo)"
realization = [
  "UA CUE 2: own cue mix, stereo",
  "Cue Mirror to: Line 7-8 → apollo-x8:line-out-7/8 → psm300-tx",
]
default = true   # part of the studio default monitoring setup (Tim, 2026-10-11)
status = "tested"   # 🧪 2026-10-11: set by Tim in Console ~23:15, read back from the engine, signal heard on
                    # the in-ears. Not yet saved to a Console session.
# Cue buses are shared across both Apollos (UAD Console manual, multi-unit cascading ✅), so the Twin X
# names CUE 2 "LINE 3/4": its sends to "LINE 3-4" are sends to CUE 2. CUE 2 blend at 22:05:
# A1 Mic Dyn −0.3, A5 OX 1 0, A6 OX2 −9.7, x8 VIRTUAL 3 0 (spare DAW return), B2 −4.4 (stale label),
# Twin X VIRTUAL 1 = Logic main out −8.6, A2 −52 dB.
# The Twin X's physical LINE 3/4 outputs also carry CUE 2 (its "LINE 3/4" output source = cue2), but nothing
# is cabled to them (Tim, 2026-10-11), so it goes nowhere.

[[scenario]]
id = "guest-headphones"
intent = "A second person on headphones with their own mix"
listener = "guest"
transducer = "apollo-x8:hp-2"
mix = "monitor mix (own blend)"
realization = ["UA CUE 2 → x8 HP 2 (front jack)"]
status = "inferred"   # conflict 2026-10-11: CUE 2 is now the in-ears mix, so HP 2 (source cue2) would
                      # carry Tim's in-ears blend. A guest would need CUE 4 (inactive) or a shared mix.

[[scenario]]
id = "more-drums-in-cans"
intent = "Headphone tracking with more of one element (e.g. drums)"
listener = "tim"
transducer = "mdr-7506:plug"
mix = "monitor mix with a submix on its own fader"
realization = [
  "logic-pro:bus-out (drum submix) → apollo-x8:virtual-3/4",
  "balance virtual 3/4 against virtual 1/2 and live inputs in the monitor mix",
]
status = "described"
# x8 VIRTUAL 3/4 is kept active as a spare DAW return for this: nothing routed to it by default.
# Tim routes a Logic aux/subgroup there when he wants, e.g., drums separate in the monitor mix
# while recording (Tim, 2026-10-11). Console already sends VIRTUAL 3 to CUE 2 at 0 dB (snapshot
# 2026-10-11), so a routed submix would appear in CUE 2.

[[scenario]]
id = "guitar-with-clean-di"
intent = "Record guitar: the processed tone plus an unaffected direct signal as a backup"
listener = "tim"
transducer = "princeton-speaker:in"   # or headphones / speakers via Console
mix = "processed guitar (OX emulation and/or TONEX) + clean DI on its own track"
realization = [
  "ES-8 patch: OUT 1/L → KHE → selected amp → OX (attenuator + emulation) → x8 in 5/6",
  "optionally OUT 2/R (loop 6 only = TONEX) → ?",
  "ES-8 TUNER (bypasses all loops) → Peterson (unmuted) → JHS Clover → snake 4 → x8 in 4: clean DI",
  "use the DI later to reamp, or live as the MIDI Guitar 3 / synth input",
]
status = "described"
