[[scenario]]
id = "more-drums-in-cans"
intent = "Headphone tracking with more of one element (e.g. drums)"
listener = "tim"
transducer = "mdr-7506:plug"
mix = "monitor mix with a submix on its own fader"
realization = [
  "logic-pro:bus-out (drum submix) → apollo-x8:virtual-3/4",
  "balance virtual 3/4 against virtual 1/2 and live inputs in the monitor mix",
]
status = "described"
# x8 VIRTUAL 3/4 is kept active as a spare DAW return for this: nothing routed to it by default.
# Tim routes a Logic aux/subgroup there when he wants, e.g., drums separate in the monitor mix
# while recording (Tim, 2026-10-11). Console already sends VIRTUAL 3 to CUE 2 at 0 dB (snapshot
# 2026-10-11), so a routed submix would appear in CUE 2.

[[scenario]]
id = "guitar-with-clean-di"
intent = "Record guitar: the processed tone plus an unaffected direct signal as a backup"
listener = "tim"
transducer = "princeton-speaker:in"   # or headphones / speakers via Console
mix = "processed guitar (OX emulation and/or TONEX) + clean DI on its own track"
realization = [
  "ES-8 patch: OUT 1/L → KHE → selected amp → OX (attenuator + emulation) → x8 in 5/6",
  "optionally OUT 2/R (loop 6 only = TONEX) → ?",
  "ES-8 TUNER (bypasses all loops) → Peterson (unmuted) → JHS Clover → snake 4 → x8 in 4: clean DI",
  "use the DI later to reamp, or live as the MIDI Guitar 3 / synth input",
]
status = "described"
