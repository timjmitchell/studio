[[unit]]
id = "khe-acs-4x4"
name = "KHE ACS 4x4 FX amp / cab / FX selector"
kind = "switcher"
status = "owned"
product = { vendor = "KHE Audio Electronics", model = "ACS series (Amplifier Cabinet Selector)", variant = "4x4 FX" }
functions = ["route", "control"]
place = "amp-shelves"
notes = "Switches guitar amps, speaker cabinets and load boxes. Attenuator Insert (S-LINE SEND/RETURN) is used: the OX is always in the loop as the attenuator, whatever amp/cab is selected."
manual = "data/manuals/pedals/KHE-ACS-Series.md"
control_surfaces = ["front-panel", "midi-pc", "midi-cc"]   # capability: PC loads amp+cab presets; CC for single commands
settings = { midi = "not used (front panel only)", dual_cab_mode = false, attenuator_insert = true, fx_loop_switching = "available (FX version)" }   # declared by Tim 2026-10-11
constraints = [
  "supervision: an amp slot is selectable only if BOTH its AMP INPUT n (guitar) and AMP OUTPUT n (speaker) are wired; unwired slots are locked out (e.g. nothing on amp 3 → the amp-3 switch does nothing)",
  "supervision: cabinet jacks are sensed; unused CABINET jacks are locked out",
  "safety interlock: an amp can switch on only if at least one load (cabinet or load box) is on. A tube amp without a load can be damaged",
  "supervision: the Attenuator Insert activates only with an attenuator present (here the OX)",
  "capacity: at most 2 loads active in parallel, and only with Dual Cab Mode (off here, so 1)",
  "current consequence: CABINET 1 (the Princeton speaker) is the only load, so it must be on for ANY amp to switch on",
  "current consequence: amp slot 2 has nothing wired, so it's locked out (slots 1, 3, 4 = Princeton, Maz 18 Jr., OR15)",
  "never change wiring with the ACS, amps or load boxes powered on (manual)",
]

ports = [
  { id = "guitar-input", label = "GUITAR INPUT", direction = "in", signal = "audio", level = "instrument", connector = "ts", notes = "rear panel" },
  { id = "amp-input-{n}", range = [1, 4], label = "AMP INPUT {n}", direction = "out", signal = "audio", level = "instrument", notes = "to the amp's guitar input" },
  { id = "amp-output-{n}", range = [1, 4], label = "AMP OUTPUT {n}", direction = "in", signal = "audio", level = "speaker", notes = "from the amp's speaker output" },
  { id = "cabinet-{n}", range = [1, 4], label = "CABINET {n}", direction = "out", signal = "audio", level = "speaker" },
  { id = "s-line-send", label = "S-LINE SEND (Attenuator Insert)", direction = "out", signal = "audio", level = "speaker" },
  { id = "s-line-return", label = "S-LINE RETURN (Attenuator Insert)", direction = "in", signal = "audio", level = "speaker" },
]

