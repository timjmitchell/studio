[[unit]]
id = "boss-es-8"
name = "Boss ES-8 Effects Switching System"
kind = "switcher"
status = "owned"
product = { vendor = "Boss", model = "ES-8" }
functions = ["route", "control"]
place = "floor-under-amp-shelves"
part_of = "pedalboard"
notes = """Everything on the pedalboard routes through the ES-8. One input used. Three outputs:
OUT 1/L → KHE (amps, OX); OUT 2/R → loop 6 only (TONEX), destination?; TUNER → Peterson → JHS Clover → snake ch 4 (clean DI).
Output selection is per patch (Output Sel 1 / 2 / 1&2). The TUNER output bypasses all effect loops (the input signal, before loops)."""
manual = "data/manuals/boss-roland/Boss-ES-8-Switcher.md"

ports = [
  { id = "in-{n}", range = [1, 2], label = "IN {n}", direction = "in", signal = "audio", level = "instrument" },
  { id = "out-1-l", label = "OUT 1/L", direction = "out", signal = "audio", level = "instrument" },
  { id = "out-2-r", label = "OUT 2/R", direction = "out", signal = "audio", level = "instrument" },
  { id = "send-{n}", range = [1, 7], label = "SEND {n}", direction = "out", signal = "audio" },
  { id = "rtn-{n}", range = [1, 6], label = "RTN {n}", direction = "in", signal = "audio" },
  { id = "rtn-7-{ch}", channels = ["l", "r"], label = "RTN 7{ch}", direction = "in", signal = "audio" },
  { id = "send-8-{ch}", channels = ["l", "r"], label = "SEND 8{ch}", direction = "out", signal = "audio" },
  { id = "rtn-8-{ch}", channels = ["l", "r"], label = "RTN 8{ch}", direction = "in", signal = "audio" },
  { id = "send-vol", label = "SEND VOL", direction = "out", signal = "audio" },
  { id = "rtn-vol", label = "RTN VOL", direction = "in", signal = "audio" },
  { id = "tuner", label = "TUNER", direction = "out", signal = "audio" },
]

