# Software units whose audio reaches Console through virtual channels.

[[unit]]
id = "logic-pro"
name = "Logic Pro"
kind = "daw"
status = "owned"
product = { vendor = "Apple", model = "Logic Pro", version = "11.2.2" }
functions = ["record", "play", "mix", "host"]
runs_on = "mac-studio"

ports = [
  { id = "main-out", label = "Main output (Output 1-2)", direction = "out", signal = "audio", medium = "virtual" },
  { id = "bus-out", label = "Bus/aux output (on demand)", direction = "out", signal = "audio", medium = "virtual", notes = "e.g. a drum submix routed to x8 VIRTUAL 3/4" },
]

[[unit]]
id = "macos-audio"
name = "macOS default output"
kind = "system-audio"
status = "owned"
runs_on = "mac-studio"
notes = "Set in Audio MIDI Setup. Browser, YouTube, etc."

ports = [
  { id = "out", label = "Default output", direction = "out", signal = "audio", medium = "virtual" },
]

[[unit]]
id = "soundid-reference"
name = "Sonarworks SoundID Reference"
kind = "monitor-correction"
status = "owned"
product = { vendor = "Sonarworks", model = "SoundID Reference", version = "5.13.5" }
functions = ["process", "measure"]
runs_on = "mac-studio"
notes = """Used to EQ the speakers and headphones toward a flat reference. Runs inside UAD Console as
Apollo Monitor Correction (realtime, on the Apollo), not as a DAW plugin. Profiles: speakers
'Mackie left mix – 2023-06-14', headphones 'Sony MDR-7506 Wired Average'. On/off state is live
Console state (see data/snapshots/ua-console/)."""
manual = "data/manuals/controllers-interfaces/UAD-Console/27-apollo-monitor-correction-by-sonarworks.md"
