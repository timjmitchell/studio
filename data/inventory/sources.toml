# Things that feed the interfaces: snake, mics, guitar rig. Mics move between sessions,
# so mic → snake patches are scenario state, not fixed connections.

[[unit]]
id = "gator-snake"
name = "Gator Cableworks Backline 6-ch snake"
kind = "snake"
status = "owned"
product = { vendor = "Gator Cableworks", model = "Backline 6-channel snake" }
functions = ["route"]
place = "floor-snake-box"
notes_place = "tails run behind the desk (behind-desk) into the x8"
notes = "Passive. Ch 1–4 tails → x8 mic inputs 1–4. Ch 5: piano DI on the box side; tail 5 currently unplugged. Ch 6 and returns? [I23]"

ports = [
  { id = "box-{n}", range = [1, 6], label = "CH {n} (floor box XLR)", direction = "in", signal = "audio", level = "mic", connector = "xlr" },
  { id = "tail-{n}", range = [1, 6], label = "CH {n} (tail XLR)", direction = "out", signal = "audio", level = "mic", connector = "xlr" },
]

