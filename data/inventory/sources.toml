[[unit]]
id = "ox-amp-top-box"
name = "UA OX Amp Top Box"
kind = "amp-simulation"
status = "owned"
product = { vendor = "Universal Audio", model = "OX Amp Top Box" }
functions = ["process", "transduce"]
place = "amp-shelves"
notes = """Patched into the KHE Attenuator Insert, so it's always in the loop as the attenuator / load. Line outs (TRS) → x8 inputs 5/6.
Two independent halves: the attenuator (Speaker Volume → TO SPEAKER) and the speaker/mic/room emulation (→ LINE OUT).
Speaker Volume at 0 still sends the emulated signal to the interface."""
components = [
  { name = "attenuator", controls = "TO SPEAKER level (Speaker Volume)" },
  { name = "speaker / mic / room emulation", feeds = "LINE OUT L/R" },
]
manual = "data/manuals/guitar-gear/UAD-OX-Amp-Top-Box.md"

ports = [
  { id = "from-amplifier", label = "FROM AMPLIFIER (red)", direction = "in", signal = "audio", level = "speaker", impedance_ohms = 8 },
  { id = "to-speaker", label = "TO SPEAKER", direction = "out", signal = "audio", level = "speaker" },
  { id = "line-out-{ch}", channels = ["L", "R"], label = "LINE OUT {ch}", direction = "out", signal = "audio", level = "line", connector = "trs" },
]
